; glimpse_fix - Split/Second PC fix (dinput8.dll)
; Every option is read when the game starts. 1 = on, 0 = off unless noted otherwise.

; ============================================================================================ controller
[Controller]
; XInput slots presented to the game as Xbox 360 pads (0-4). The game takes at most 4 joysticks,
; lower this if a wheel or other DirectInput device must fit in as well.
; At 0 the per-frame extras (photo mode, HUD and zoom keys, unlocks, boost, LOD and pop-in fixes)
; do not run, as they run with the pads' poll.
VirtualPads=4
; Remove the real XInput controllers from DirectInput so they do not show up twice.
HideXInputFromDirectInput=1
; 1 = LT and RT on separate axes (brake and throttle at the same time). 0 = shared Z axis like the stock driver.
SeparateTriggers=1
; Radial stick deadzone and trigger deadzone, 0.0 - 1.0
StickDeadzone=0.15
TriggerDeadzone=0.05
; Rumble multiplier (0 = off, 1 = as the game sends it)
RumbleStrength=1.0
; Prompt bar icons while the controller is in use: xbox, playstation or keyboard (= never switch)
ButtonGlyphs=xbox
; A held D-pad keeps scrolling in the menus (car select included): one step per press, then after
; MenuRepeatDelay ms a step every MenuRepeatRate ms plus a 40 ms release. The pads of VirtualPads only, not
; DirectInput devices passed through. Not during a race; a direction pressed within 0.5 s of opening the
; pause menu repeats only after pressing it again. 0 = as the game (one step per press)
MenuRepeat=1
MenuRepeatDelay=450
MenuRepeatRate=160

; ============================================================================================== graphics
[Graphics]
; 60 = 60 fps with the simulation stepped exactly as before (one 1/60 s tick per frame), 30 = stock
FrameRate=60
; The highest of the game's graphics quality levels it may use, whatever its menu is set to
; (the level chosen there is kept): 3 = no limit, 2 = at most High, 1 = at most Medium, 0 = Low
QualityCap=3
; Texture detail: 0 = full, 1 = half, 2 = a quarter, 3 = an eighth of the size (textures with mip
; levels only: text stays sharp, menu and HUD pictures with mip levels get blurrier too)
TextureDetail=0
; Car glass as on the Xbox 360: the PC port lets every car window write its opacity into the
; picture's specular intensity, so the sun lit the glass with the shine of whatever lies behind it
; (the window frames of the converted DLC cars turned flat white in the sun). 1 = fixed (the glass
; of the base cars changes slightly too: no sun highlight on it), 0 = as the game
GlassFix=1
; Anisotropic texture filtering, 2 - 16 (0 = as the game, which uses plain linear filtering)
Anisotropy=16
; Anti-aliasing: SMAA 1x on the 3D picture before the HUD is drawn, so text and HUD stay sharp.
; 1 = on, 0 = as the game (no edge smoothing; only the quality level Very High supersamples)
SMAA=1
; Motion blur multiplier (the game enables it per camera at graphics quality High/Very High).
; At FrameRate=60 the blur is doubled automatically so it looks like at 30 fps. 0 = off.
MotionBlurStrength=1.0
; Darkened screen edges set by the race cameras: 0 = off, 1 = as the game
Vignette=0
; The cameras' screen gradient, the translucent blue band at the top of the screen. 0 = off
Gradient=1
; Bloom (glow around bright areas): 1 = as the game, 0 = off (the frame is still tone mapped)
Bloom=1
; Bloom look, multiplied on top of each camera's values (1.0 = as the game, 0 - 10). They are read
; again every 2 seconds, so you can change them while the game runs (Alt+Tab, edit, save).
;   BloomStrength  glow on bright areas
;   BloomTone      second bright pass value, softer effect
;   BloomCurve     how the glow is added (below 1.0 has no effect)
;   Exposure       brightness of the whole picture
BloomStrength=1.0
BloomTone=1.0
BloomCurve=1.0
Exposure=1.0
; Lens flares of the sun and lights, including the screen space flare: 1 = as the game, 0 = off
LensFlare=1
; Flares of sparks, explosions and lights: 1 = as the game, 0 = off
ParticleFlare=1
; 1 = HDR10 picture for an HDR display (switch HDR on in the Windows display settings). The game then
; runs in a borderless window over the whole screen; the picture goes out through a DXGI swap chain.
HDR=0
; the display's peak brightness in nits (400..10000): the highlights of the game's HDR image (sun,
; sky, lights) go up to this
HDRPeakBrightness=1000
; the brightness of the game's white in nits (80..500): menus, HUD, a white wall in daylight
HDRPaperWhite=200
; The PC port scales the powerplay icons over the cars and the route change markers twice above
; 1280 pixels width (3x at 4K). 1 = console size at every resolution, 0 = stock
FixPowerplayIconSize=1

; ================================================================================================= world
[World]
; Sector streaming pool in MB (stock 57). A bigger pool keeps the sharp textures loaded instead of
; falling back to blurry/grey ones. Only used when SplitSecond.exe has the LAA flag (4 GB address space).
StreamPoolMB=512
; Distance multiplier for the high and mid environment LODs, sector and object streaming (400 m),
; particles, debris and the powerplay objects (levels set them, e.g. 150/300 m, terminal 300 m).
; The low LOD hand-over to the backdrop models stays as the level sets it.
LodDistanceScale=2.0
; Multiplier for how far the sun shadows reach (the game: 300 m) at the High and Very High quality
; levels in single player, 1.0 to 3.0. Shadows close to the car get a little softer the higher it
; is. 1.0 = as the game
ShadowDistance=2.0
; Sun shadow map size: 1 = as the game (three cascades of 1024x1024), 2 = double (about 70 MB more
; graphics memory), 4 = quadruple (about 360 MB more, experimental)
ShadowResolution=2
; 0 = nothing casts a shadow (the game's own switch for its shadow maps), 1 = as the game
Shadows=1
; Buildings and objects are only drawn when the current track section's precomputed
; visibility list names them, so they pop in at section borders whatever their distance.
; 1 = ignore the lists (distance and view decide; a little more to draw), 0 = as the game
PopInFix=1
; Opponent car detail. The PC release uses the PS3's settings: only 3 opponents in medium detail and every
; opponent coarse from 100 m on, so cars pop between detail levels. 0 = as the PC release,
; 1 = as the Xbox 360 (medium detail for all, coarse from 200 m on), 2 = high (all in full detail up to 40 m)
CarDetail=1

; ================================================================================================ camera
[Camera]
; Field of view of the race cameras (chase and bumper), as a factor of the game's own: 1.2 = 20 %
; wider, 0.8 = narrower. The game still widens the view with speed on top of it. 1.0 = as the game
FOV=1.0
; Screens wider than 16:9 (21:9, 32:9). Has no effect on 16:9 and narrower screens.
; 1 = the race cameras keep the picture height of 16:9 instead of cutting off the top and bottom.
; 2 = experimental, full ultrawide: every camera keeps the height of 16:9 (menus, power plays,
;     crash and replay cameras, split screen), menus, HUD and result screens are shown at 16:9 in the
;     centre with their backgrounds reaching the screen edges, cinematics keep their aspect.
;     Steam build only; the other builds use 1. 0 = stock
UltrawideFix=1
; Zoom the race camera while a key is held: ZoomInKey closer, ZoomOutKey wider, ZoomResetKey back
; to FOV. Keys are virtual key codes: 0x31 = 1, 0x32 = 2, 0x33 = 3 (top row). 0 = off
ZoomKeys=0
ZoomInKey=0x31
ZoomOutKey=0x32
ZoomResetKey=0x33
; Photo mode: during a race, PhotoModeKey (0x46 = F) or the pad's Back button holds the world still,
; hides the HUD and the on-screen messages and frees the camera. Left stick / W A S D move, right
; stick / I J K L look, triggers / Q E down and up, A / Shift faster, LB RB / zoom keys zoom, Y + LB RB
; / U O tilt. D-pad / arrow keys: up and down focus distance, left and right depth of field (left end
; = off); with X / Ctrl held: up and down bloom, left and right exposure; left stick click / Backspace
; resets the look (up and down switch the depth of field on when it is off). No car is put back on
; the track meanwhile. Back, B, Esc or PhotoModeKey again: back to the race. Keys the game uses itself
; (Esc, P, Enter, arrows) do not work as PhotoModeKey.
; Once your car is wrecked the crash sequence decides the view: on a crash on the road the camera
; stays tied to the car, after leaving the track (falls) it cannot be taken over at all. Enter the
; photo mode before the crash for a free camera.
PhotoMode=0
PhotoModeKey=0x46
; How much the race cameras (chase and bumper) shake on bumps and hits, 1.0 = as the game. Lower
; values smooth their rotation (against motion sickness); turns follow a little later. 0.0 = smoothest
CameraShake=1.0
; 1 = no camera shake from explosions, collapsing buildings and power plays nearby
ExplosionShakeOff=0
; Switch the HUD off and on during a race with this key (0x48 = H). 0 = no key
HudKey=0

; ============================================================================================== gameplay
[Gameplay]
; Everything selectable without career progress: all tracks, events, episodes, game modes and
; vehicles (the game's own debug switches; the profile is not changed). 0 = as the game
UnlockAll=0
; Show Continue when the single-player finish card accepts it. Shortens the offline Quick Play
; entrance and keeps the Season animation intact. Requires the English/German Steam build and stock finish card.
; 0 = as the game, 1 = on.
RaceEndTiming=0
; The extras the PC version unlocks with cheat codes: the Expressway track, the Cobretti SlipStream,
; the retailer branded cars and the Euro livery pack. 0 = as the game (codes still work)
BonusContent=0
; Achievements and with them the decals: 1 = all of them, 2 = only the ones that cannot be earned any
; more (the six from ranked online races and the Pure decal; the "all achievements" one follows once
; the rest is earned). Unlocked in the next single player race; achievements are saved with the profile
; and stay when this is set back to 0, the Pure decal is shown while this is on. The profile files are
; copied to glimpse_backup before the first unlock. 0 = as the game
UnlockDecals=0
; HIGHLY EXPERIMENTAL: can softlock the game, especially together with the photo mode.
; Seconds from a crash of yours (crashes, takedowns, power plays) to the respot; the crash camera
; keeps showing the wreck until then.
; The photo mode holds the respot anyway while it is on. 0 = as the game
WreckTime=0
; Boot movies at every start: 0 = as the game, 1 = skip the publisher logo, 2 = skip the logo and the intro
SkipIntro=0
; Cutscenes (season episodes "Coming up" and "Next time", end sequence, demo and boot movies): the first press of
; A, B, X, Y, Start, Enter or Space shows "Press again to skip", a second press within 3 seconds skips.
; 1 = on, 0 = as the game
CutsceneSkip=1

; --- boost
; BoostButton or BoostKey held: player 1 gets extra speed along the car's heading (only while driving
; forward), up to BoostMaxSpeed (m/s; 90 = 324 km/h) with BoostAcceleration (m/s^2; 15 = about
; 1.5 g). Motion blur rises to BoostMotionBlur times its strength while boosting (1 - 5).
Boost=0
; Keyboard key for the boost, a virtual key code: 0xA0 = left Shift (not used by the game).
; 0 = pad only
BoostKey=0xA0
; pad button for the boost: X, Y, LS, RS (stick clicks) or None. X and Y are free while driving; when the
; boost or the handbrake uses Y, the game's camera change (Y) moves to D-pad down during a race
BoostButton=X
BoostAcceleration=15
BoostMaxSpeed=90
BoostMotionBlur=3.0
; LS+RS (both sticks pressed) or PowerBarFillKey: power play bar full. The key is a virtual key
; code: 0xA2 = left Ctrl (not used by the game), 0 = pad only
PowerBarFill=0
PowerBarFillKey=0xA2
; The game has no handbrake. 1 = while HandbrakeButton (pad: X, Y, LS, RS, None) or HandbrakeKey (virtual
; key code, 0x58 = X, not used by the game, 0 = none) is held, player 1's car is thrown into a slide.
; HandbrakeMode 1 = drift: the game's own slide physics, as when a power play blast throws a car
; sideways. 2 = brake: the brake pedal fully pressed (above 30 km/h), the game brakes the rear the more
; you steer. In a network race (SteamLAN) the host's setting applies to everybody.
Handbrake=0
HandbrakeButton=Y
HandbrakeKey=0x58
HandbrakeMode=1
; drift type: how hard the handbrake slows the car while held, m/s^2 (10 = about 1 g, 0 = the slide only)
HandbrakeStrength=15
; drift type: how fast the car turns into the slide at full steering, rad/s (2.5 = about 140 degrees
; a second, 0 = the game's own slide only)
HandbrakeDrift=2.5

; --- AI boost (EXPERIMENTAL)
; AI cars boost too, in bursts while they are behind player 1 or not far ahead.
; BoostAcceleration and BoostMaxSpeed apply to them as well.
AIBoost=0
; 1 = easy (0.8x your boost, 3 s tank, now and then, up to 30 m ahead)
; 2 = normal (1x, 5 s tank, about once a second, up to 60 m ahead)
; 3 = hard (1.3x, 8 s tank, almost constantly, up to 150 m ahead)
AIBoostLevel=2
; 1 = the tank never empties, 0 = limited, refilled over time
AIBoostUnlimited=0
; 1 = only on straights at speed, 0 = anywhere while driving forward (also in corners)
AIBoostStraightOnly=1
; 1 = chaos mode: every AI car boosts all the time, everywhere, also far ahead of you, with an
; endless tank, the AI's power play bar is always full and the AI drives at its highest skill. While this is 1, AIBoostLevel, AIBoostUnlimited and AIBoostStraightOnly do not apply.
AIBoostChaos=0

; ================================================================================================= audio
[Audio]
; 1 = the opponents' engines can be heard. The PC release loads each opponent's engine sounds into a
; slot sized for the Xbox 360's smaller sound banks, the PC's banks do not fit and stay silent; 1 makes
; the seven slots 256 KB each (about 1 MB more sound memory). 0 = as the game.
OpponentEngines=1
; 1 = the reverb presets of the Xbox 360 release. On the PC six of the seven presets (halls, tunnels,
; under bridges, the menu) hold one stock value set; the console's are louder and ring longer where
; the sound designers set them. 0 = as the game.
ConsoleReverb=1

; ================================================================================================ online
[Online]
; EXPERIMENTAL: the game's LAN mode with the players of a Steam lobby instead of the
; local network. The packets go through Steam (direct or relayed), no ports to open. Needs steam_api.dll
; (Steamworks SDK) next to the game and the game started through Steam. Every player shows up with a
; 10.x.y.z address. In the game: LAN, then create or search a game as usual.
; Steam friends: "Join game" in the friends list puts you into their lobby (also when the game is not
; running yet); then search the LAN game in the game's menu.
; In a LAN game the extras that change the race (Boost, Handbrake, PowerBarFill, AIBoost, WreckTime)
; follow the settings of the player who created the game (the host), the same for everybody; the photo
; mode is a free camera there and does not hold the world still (the others race on). A banner at the
; top left shows whose rules apply when you join, when players come and go and when a LAN game starts.
SteamLAN=0
; 1 = your lobby is open to your Steam friends only and not listed for anybody else; when a friend is
; already in one, you join theirs. LobbyName is not used then.
FriendsOnly=0
; Players with the same name meet in one lobby (not case sensitive; letters, digits, - and _), like a
; password. Empty = the public lobby "glimpse".
LobbyName=

; ================================================================================================= debug
[Debug]
; Write SplitSecondPad.log next to the game. With Log=1, F9 in the game saves the next frame pass
; by pass to the folder glimpse_dump, for image errors (the game stands still for a few seconds)
Log=0
; Development, with Log=1: pixel shader hashes as the frame dump's log shows them, separated by commas
; (tools\dlc\shaders\pshash.py lists those of the game's shaders). For the first 4 draws with one of
; them, the dump saves every render target right before and after the draw. Empty = none
DumpWatchPS=
; 1 = at the next start write the game's textures as DDS files to glimpse_textures (one folder per
; archive with an index.txt), then the game closes and this goes back to 0
DumpTextures=0

; =================================================================================================== dlc
[DLC]
; EXPERIMENTAL: 1 = every glimpse_dlc\*.ark in the game folder is laid over data\resident.ark, in name order
; (a later archive replaces the entries of an earlier one); track_*.ark only with Tracks (below). The files
; come from your own Xbox DLC, converted with Build DLC / Install in glimpse_config.exe. 0 = the game's own
; data only, whatever glimpse_dlc holds
Overlays=0
; EXPERIMENTAL, needs Overlays=1 with the converted track overlay in glimpse_dlc and the converted track
; files in glimpse_dlc\quarry\data and glimpse_dlc\nem_quarry\data (or below data): 1 = the converted DLC
; tracks get their own track numbers, so quick play can load them: Quarry (15) and Minepit Park (16, the
; nemesis track nem_quarry of Survival At The Rock, a Survival track). Off by itself while SteamLAN=1 unless
; TracksOnline=1 (below); do not use the game's own LAN mode with players who lack the track.
; The track overlay must be named glimpse_dlc\track_*.ark: it is only laid over resident.ark when the track
; is registered, otherwise quick play would list a track it cannot load. With nem_quarry the track overlay
; also brings the DLC game mode Survival Race (two players, five laps among the trucks), which the game lists
; in split screen itself (not online); its quick play movie comes with Modes=1
Tracks=0
; 1 = the DLC tracks also online (SteamLAN=1). The game sends only the track's number, so you then see and
; join only the LAN games of players with the same DLC tracks (same track pack and glimpse_fix version), and
; they yours; the others' games are not listed (the banner says why). Players without DLC tracks (0 here or
; no track pack) play with each other as before
TracksOnline=0
; With Tracks=1: 1 = Quarry plays its own race music from the DLC (DLC3_Music: pre-race, race sections,
; finish stingers, result screen), as on the Xbox 360. Needs the converted dlc3_music.fev/.fsb in
; glimpse_dlc\quarry\data\audio\release\dlc3_music (or below data) and a track overlay built with them;
; without them Quarry plays the game's own race music. Only Quarry: nem_quarry (Minepit Park), the other
; tracks and the menus keep the game's music. Needs Overlays=1 and Tracks=1, and VirtualPads 1 or more (it
; is set up from the pads' poll, like the other per-frame extras)
Music=1
; EXPERIMENTAL, needs Overlays=1 with the mode pack (cars + game mode) in glimpse_dlc: 1 = the converted
; DLC game mode Deadline (a countdown time trial; its pickup boxes with Pickups=1) can be chosen in quick
; play. The game shows it locked, since no season event uses it; this opens only Deadline's entry in the
; quick play mode list (the profile and the game's DLC unlock flags are not changed). Single player only.
; As on the Xbox, in every Deadline race on one screen, also with Pickups=0: the top centre seconds counter
; is hidden, the end screen shows the time left on the clock and the results rank you among the rivals
; HAMMER, RAPTOR, VIXEN, LIVE WIRE, TORPEDO, BRAWN and RIGG (their times from the mode pack); a run
; whose clock runs out ends as DNF. Nothing of it is saved. The rest of Deadline's HUD comes with Pickups=1.
; Also shows Survival Race's own quick play movie (the mode itself comes with Tracks=1)
Modes=0
; EXPERIMENTAL, with Modes=1 and the mode pack built with the pickup files (tools\dlc\mode\deadline_mode.py,
; stage 2): 1 = Deadline's pickup boxes. Driving through one stops the clock for 0.5 s, while drifting for
; 2 s; the stopped time adds up. Only with Pickups=1, as on the Xbox: the timer under the car turns cyan
; while the clock stands, "+0.5s" / "+2.0s" shows top centre as the game's own message, the Xbox's pickup
; sounds and the voice counting down the last five seconds play (from the mode pack), and the Frozen Time
; look (PickupVignette), and a hint to drift through the pickups comes up. The texts are glimpse_fix's own
; (five languages, the same rules in other words): the Xbox's official ones are in its title update, not
; in the DLC packages. They need a TU4 text table that the release cannot produce (made with a local
; development tool that is not part of glimpse_fix); without it the converters write their own texts.
; A restart puts every box back. The boxes are the Xbox model when the mode pack brings it. The start times are the Xbox's then (DeadlineBonus is
; not added). While the clock stands the race time stands too (as on the Xbox), so the time left decides
; the rank among the rivals. The hidden top counter, the rivals and the time left come with Modes=1
; alone. Only in a Deadline race on one screen; anything else is left as it is
Pickups=0
; With Pickups=1: 1 = the Xbox's "Frozen Time" look while the clock is stopped: its two post presets
; (from the mode pack) on the game's own vignette and colour grading, cyan screen edges and the level's
; colour grade off, fading out in about 1 s; with a mode pack built before, a cyan glow along the edges.
; 0 = off
PickupVignette=1
; Seconds added to Deadline's start times while Pickups=0 (with Modes=1): without the boxes the Xbox start
; times (60-70 s) leave hardly enough time for a lap. 0 to 300 whole seconds (a fraction is rounded),
; 0 = the Xbox times. Mode packs built before
; the pickups (start times 110-120 s) already carry 50 s: nothing is added to them, and with Pickups=1 they
; give the boxes plus those 50 s
DeadlineBonus=50
; EXPERIMENTAL, with Overlays=1 and a car pack in glimpse_dlc: 1 = the converted DLC cars are listed in the
; car select of quick play (after the game's own cars) without UnlockAll. Not in the career (see
; CarsCareer), not online, not in training/tutorial. A DLC car picked in quick play becomes the profile's
; car (as with UnlockAll=1); the career's car select then starts at its first car. Without a car pack
; nothing happens. With UnlockAll=1 the game lists them itself and this does nothing; it then lists them
; online too, so with SteamLAN=1 you meet only players with the same car pack and UnlockAll=1
Cars=1
; EXPERIMENTAL, with Cars=1: 1 = the DLC cars also in the career's car select (the one before an event
; started from the episode screen). The car choice between career events in a race (the in-game car
; select) still offers only the season's cars and shows its first car while a DLC car is yours. 0 = off
CarsCareer=0
